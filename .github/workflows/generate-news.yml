name: generate-news

# Genera 1-3 notas de opinión/análisis con Claude API y las sube a Sanity como
# drafts. El editor revisa y publica desde el studio.
#
# Cron: 11:00 UTC = 08:00 hora Argentina (UTC-3, sin DST).
# También dispatchable manualmente desde GitHub UI con override de DAILY_COUNT
# y MONTHLY_TOKEN_LIMIT.
#
# Secrets requeridos en el repo:
#   GEMINI_API_KEY      token de la Gemini API (https://aistudio.google.com/apikey)
#   SANITY_PROJECT_ID   id del proyecto Sanity
#   SANITY_DATASET      dataset (típicamente "production")
#   SANITY_TOKEN        token Editor de Sanity para escribir drafts

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      daily_count:
        description: 'Cuántas notas generar (default 2)'
        required: false
        default: '2'
      monthly_token_limit:
        description: 'Tope mensual de tokens (default 1000000)'
        required: false
        default: '1000000'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Generate articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          DAILY_COUNT: ${{ github.event.inputs.daily_count || '2' }}
          MONTHLY_TOKEN_LIMIT: ${{ github.event.inputs.monthly_token_limit || '1000000' }}
        run: npm run generate-articles

      - name: Commit changes (queue + usage tracking)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Solo se modifican estos dos archivos cuando el script consume topics
          # y suma al contador. Los drafts de Sanity ya están en el server, no
          # tocan el repo.
          git add src/data/topics-queue.json data/ai-usage.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios — no commit."
          else
            git commit -m "chore(ai): consume topics + update usage tracking [skip ci]"
            git push
          fi
